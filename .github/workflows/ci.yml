name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the old run; no point burning minutes on a
# commit nobody will look at again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # §4 constraint — the structural guarantee that the AST pipeline never reaches
      # outside this repository's own src/. Runs FIRST and cheaply: if this fails, the
      # rest of the run is irrelevant.
      - name: Check AST source scope
        run: npm run check:ast-scope

      # The pipeline output is gitignored, so everything downstream needs it generated.
      # This is also §11's "smoke test that the generation script runs without throwing".
      - name: Generate AST graph
        run: npm run generate:ast

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Playwright's webServer runs `npm run preview`, which needs a real build to serve
      # — and §10's prerendered HTML only exists after a build, so dev mode won't do.
      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # §11 desktop paths + §8.3 mobile-viewport gesture-axis-locking coverage.
      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 5

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # §11 — "the 3D scene makes it easy to regress performance without noticing."
      # Budgets live in lighthouserc.json.
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
